<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Andrea Alice</title>
  <meta name="description" content="01101101 01110101 01110011 01101001 01100011 00100000 01100110 01101111 01110010 00100000 01110100 01101000 01101001 01101110 01101011 01101001 01101110 01100111" />
  <meta name="theme-color" content="#ECE5D7" />

  <!-- ===================================================================
       FASE 2 (design): moodboard applicata via variabili in styles.css.
       DA FORNIRE ancora: file font Faricy New (in ./fonts/), asset logo
       (vinile "ANDREA ALICE / ARTISON"), favicon, immagini Open Graph.
       =================================================================== -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ============================ HEADER / NAV ============================ -->
  <header class="site-header" id="top">
    <nav class="nav" aria-label="Main navigation">
      <a class="nav__brand" href="#top">Andrea&nbsp;Alice</a>

      <!-- Toggle mobile: mostrato solo sotto il breakpoint, gestito in script.js -->
      <button
        class="nav__toggle"
        type="button"
        aria-expanded="false"
        aria-controls="nav-menu"
        aria-label="Open navigation menu">
        <span class="nav__toggle-bar" aria-hidden="true"></span>
        <span class="nav__toggle-bar" aria-hidden="true"></span>
      </button>

      <ul class="nav__menu" id="nav-menu">
        <li><a href="#music">Music</a></li>
        <li><a href="bio.html">Bio</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <!-- ============================== HERO ============================== -->
    <section class="hero" aria-labelledby="hero-title">
      <!-- Visual audio-reattivo (Remotion, visual-tools/remotion-hero/): finché
           out/hero-visual.webm non viene renderizzato e copiato qui, il video
           non carica nulla e resta visibile solo il gradiente CSS sottostante. -->
      <video class="hero__bg-video" aria-hidden="true" autoplay muted loop playsinline>
        <source src="hero-visual.webm" type="video/webm" />
      </video>
      <!-- Pulviscolo CSS: movimento leggero finché il video Remotion non c'è -->
      <div class="hero__motes" aria-hidden="true">
        <span class="hero__mote hero__mote--1"></span>
        <span class="hero__mote hero__mote--2"></span>
        <span class="hero__mote hero__mote--3"></span>
      </div>
      <!-- Texture decorativa: gatto ASCII (moodboard). Solo estetica → aria-hidden -->
      <pre class="ascii-cat" aria-hidden="true">   /\_/\
  ( o.o )
   > ^ <</pre>
      <div class="wrap hero__inner">
        <h1 class="hero__title" id="hero-title">Andrea Alice</h1>
        <p class="hero__tagline">01101101 01110101 01110011 01101001 01100011 00100000 01100110 01101111 01110010 00100000 01110100 01101000 01101001 01101110 01101011 01101001 01101110 01100111</p>
      </div>
    </section>

    <!-- ============================== MUSIC ============================== -->
    <!-- Discografia completa. Release configurate in script.js → RELEASES.
         Ogni card linka l'ascolto (oggi Spotify) e la pagina di dettaglio
         in releases/<slug>.html (making of, foto, strumentazione). -->
    <section class="section music" id="music" aria-labelledby="music-title">
      <div class="wrap">
        <header class="section__head">
          <h2 class="section__title" id="music-title">Music</h2>
        </header>

        <ul class="release-grid" data-releases></ul>
      </div>
    </section>

  </main>

  <!-- ============================== FOOTER ============================== -->
  <footer class="site-footer" id="contact" aria-labelledby="contact-title">
    <div class="wrap">
      <h2 class="section__title" id="contact-title">Contact</h2>

      <!-- Lista social generata da script.js → SOCIAL_LINKS -->
      <ul class="social" data-social></ul>

      <p class="footer__credit">
        © <span data-year>2026</span> Andrea Alice
      </p>
    </div>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
